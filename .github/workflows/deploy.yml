name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # Fetches the "now watching" poster. The key comes from a repository
      # secret and never reaches the browser - only the public title/poster do.
      - name: Fetch now-watching data
        run: node scripts/fetch-movie.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - run: npm run build

      # The site is built with base: "/spike-portfolio", so dist/ is published
      # to the root of gh-pages - the base path handles the /spike-portfolio
      # prefix. The root index.html stub is kept so https://psb-001.github.io/
      # redirects to the portfolio.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          enable_jekyll: false